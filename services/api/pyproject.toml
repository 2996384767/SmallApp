[project]
name = "aaa-api"
version = "0.1.0"
description = "Flask API for AAA Small App"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1,<4",
    "flask-cors>=5,<7",
    "flask-migrate>=4,<5",
    "flask-sqlalchemy>=3.1,<4",
    "gunicorn>=23,<24",
    "pymysql>=1.1,<2",
    "python-dotenv>=1,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aaa_api"]
