<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MVP 演示数据</title>
    <style>
      body { margin: 0; color: #18212b; background: #f4f6f8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      main { width: min(720px, calc(100% - 32px)); margin: 48px auto; }
      h1 { margin: 0 0 8px; font-size: 28px; letter-spacing: 0; }
      p { margin: 0 0 24px; color: #5a6875; }
      table { width: 100%; overflow: hidden; border: 1px solid #d9e0e6; border-collapse: separate; border-spacing: 0; border-radius: 6px; background: #fff; }
      th, td { padding: 12px 16px; border-bottom: 1px solid #e6ebef; text-align: left; }
      th { color: #40505e; background: #eef2f5; font-size: 14px; }
      tr:last-child td { border-bottom: 0; }
      .empty { color: #6b7782; text-align: center; }
      .status { color: #0052d9; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <h1>MVP 演示需求</h1>
      <p>数据来源：本地 MariaDB smallapp / demand 表，仅展示前 30 条。</p>
      <table>
        <thead>
          <tr>
            <th>需求编号</th>
            <th>国家</th>
            <th>品类</th>
            <th>数量</th>
            <th>工艺</th>
            <th>交期</th>
            <th>状态</th>
          </tr>
        </thead>
        <tbody>
          {% for row in rows %}
          <tr>
            <td>{{ row.demand_no }}</td>
            <td>{{ row.country }}</td>
            <td>{{ row.category }}</td>
            <td>{{ row.quantity }}</td>
            <td>{{ row.craft }}</td>
            <td>{{ row.delivery_days }} 天</td>
            <td class="status">{{ row.status }}</td>
          </tr>
          {% else %}
          <tr><td class="empty" colspan="7">暂无数据</td></tr>
          {% endfor %}
        </tbody>
      </table>
    </main>
  </body>
</html>
